[package]
name = "storegenie-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "StoreGenie Pro desktop app"

[lib]
name = "storegenie_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
storegenie-core = { path = "../../../crates/storegenie-core", features = ["os-keychain"] }
tauri = { version = "2.9", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "fs", "rt"] }
anyhow = "1"
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "gzip"] }
