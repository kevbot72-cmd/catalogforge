[package]
name = "forge-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CatalogForge engine: connections, local cache, staging, sync and media pipeline"

[dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "time"] }
futures = "0.3"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "gzip", "stream"] }
url = "2"
percent-encoding = "2"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
flate2 = "1"
rusqlite = { version = "0.32", features = ["bundled", "serde_json"] }
sqlx = { version = "0.8", default-features = false, features = ["mysql", "runtime-tokio", "tls-rustls"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "rayon"] }
webp = "0.3"
rayon = "1"
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
regex = "1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
walkdir = "2"
keyring = { version = "3", optional = true, features = ["apple-native", "windows-native", "sync-secret-service"] }

[features]
default = []
os-keychain = ["keyring"]

[dev-dependencies]
tempfile = "3"
